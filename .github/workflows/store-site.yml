name: Store Site

on:
  push:
    branches:
      - main
    paths:
      - "apps/extension/store/site/**"
      - ".github/workflows/store-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: store-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/extension/store/site

      - id: deployment
        uses: actions/deploy-pages@v4
