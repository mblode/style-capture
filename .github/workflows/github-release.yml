name: GitHub Release

on:
  push:
    branches:
      - main

concurrency:
  group: github-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get extension version
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: version
        run: echo "version=$(node -p "require('./apps/extension/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build extension
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.check_release.outputs.exists == 'false'
        run: npx turbo run build --filter=@style-capture/extension

      - name: Create GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            apps/extension/release/style-capture.zip \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "$(cat <<'EOF'
          ## Install before Chrome Web Store approval

          1. Download `style-capture.zip` from the assets below
          2. Unzip the file
          3. Open `chrome://extensions` in Chrome
          4. Enable **Developer mode** (top right toggle)
          5. Click **Load unpacked** and select the unzipped folder
          EOF
          )"

      - name: Publish to Chrome Web Store
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.check_release.outputs.exists == 'false'
        continue-on-error: true
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_PUBLISH_TARGET: default
        run: node apps/extension/scripts/chrome-web-store-publish.mjs release --target "$CWS_PUBLISH_TARGET"
