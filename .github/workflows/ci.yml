name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx --no-install playwright install --with-deps chromium

      - name: Changeset Status
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: npx changeset status --since origin/main

      - name: Lint
        run: npm run check

      - name: Typecheck
        run: npm run check-types

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check CLI executable
        run: |
          node --input-type=module <<'NODE'
          import { accessSync, constants, readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { execFileSync } from 'node:child_process';
          const directory = 'apps/cli';
          const pkg = JSON.parse(readFileSync(`${directory}/package.json`, 'utf8'));
          for (const entry of Object.values(pkg.bin)) {
            const executable = resolve(directory, entry);
            accessSync(executable, constants.X_OK);
            execFileSync(process.execPath, [executable, '--help'], { stdio: 'inherit' });
          }
          NODE
