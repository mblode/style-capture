<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Capture Small Promo Tile</title>
    <link rel="stylesheet" href="./store-assets.css">
  </head>
  <body>
    <div class="tile-shell">
      <div class="tile">
        <div class="eyebrow">Style Capture</div>
        <h1 class="tile__title">Capture live CSS.</h1>
        <p class="tile__copy">
          Select a subtree, keep the computed truth, and paste a Claude-ready
          export instantly.
        </p>
        <div class="chip-row">
          <div class="chip">Local only</div>
          <div class="chip">Tailwind hints</div>
          <div class="chip">activeTab</div>
        </div>
        <div class="mini-browser">
          <div class="mini-browser__bar">
            <span></span><span></span><span></span>
          </div>
          <div class="mini-browser__body">
            <div class="badge">Clicked</div>
            <h3
              style="margin: 12px 0 6px; font-size: 22px; letter-spacing: -0.04em;"
            >
              Pricing card
            </h3>
            <p style="margin: 0; color: var(--muted); font-size: 13px;">
              Computed layout and spacing captured from the live page.
            </p>
            <div class="highlight"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
